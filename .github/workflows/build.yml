name: Build UltraVNC Windows Binaries

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: 'C:\vcpkg'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize Directory Structure
        shell: pwsh
        run: |
          if (Test-Path "UltraVNC-main") {
              Write-Host "Moving files from UltraVNC-main to root directory..."
              Get-ChildItem -Path "UltraVNC-main" | ForEach-Object {
                  Move-Item -Path $_.FullName -Destination "." -Force
              }
              Remove-Item -Path "UltraVNC-main" -Recurse -Force
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Integrate and Install vcpkg Dependencies
        shell: pwsh
        run: |
          cd C:\vcpkg
          .\vcpkg.exe integrate install
          # UltraVNC CMake-এর জন্য প্রয়োজনীয় সব কম্প্রেশন ও ইমেজ লাইব্রেরি
          .\vcpkg.exe install zlib:x64-windows liblzma:x64-windows libjpeg-turbo:x64-windows lzo:x64-windows zstd:x64-windows

      - name: Configure and Build via CMake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build_x64" -Force
          Set-Location "build_x64"

          # CMake কনফিগারেশন vcpkg টুলচেনসহ
          cmake ../cmake -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="x64-windows"

          # প্যারালাল বিল্ড
          cmake --build . --config Release --parallel

      - name: Collect Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "output" -Force
          
          # তৈরি হওয়া সমস্ত এক্সিকিউটেবল ও ডিএলএল সংগ্রহ
          Get-ChildItem -Path "build_x64" -Recurse -Include "winvnc.exe", "vncviewer.exe", "*.dll" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "output" -Force
          }

      - name: Upload Built Binaries
        uses: actions/upload-artifact@v4
        with:
          name: UltraVNC-Binaries-x64
          path: output/
