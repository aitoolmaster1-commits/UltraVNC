name: Build UltraVNC Windows Binaries

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: 'C:\vcpkg'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize Directory Structure
        shell: pwsh
        run: |
          if (Test-Path "UltraVNC-main") {
              Write-Host "Moving files from UltraVNC-main to root directory..."
              Get-ChildItem -Path "UltraVNC-main" | ForEach-Object {
                  Move-Item -Path $_.FullName -Destination "." -Force
              }
              Remove-Item -Path "UltraVNC-main" -Recurse -Force
          }

      - name: Populate 3rdparty noVNC
        shell: pwsh
        run: |
          # winvnc.rc ফাইলের জন্য noVNC ফাইল ক্লোন করা
          if (Test-Path "3rdparty/noVNC") {
              Remove-Item -Path "3rdparty/noVNC" -Recurse -Force
          }
          git clone --depth 1 https://github.com/novnc/noVNC.git 3rdparty/noVNC

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg Dependencies
        shell: pwsh
        run: |
          cd C:\vcpkg
          .\vcpkg.exe integrate install
          .\vcpkg.exe install --triplet x64-windows zlib liblzma libjpeg-turbo lzo zstd openssl libpng

      - name: Build Server (WinVNC & Hooks) via MSBuild
        shell: cmd
        run: |
          msbuild winvnc\winvnc.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m

      - name: Build Viewer (VncViewer) via MSBuild
        shell: cmd
        run: |
          msbuild vncviewer\vncviewer.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m

      - name: Collect Built Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "output" -Force
          
          Get-ChildItem -Path "." -Recurse -Include "winvnc.exe", "vncviewer.exe", "vnchooks.dll" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "output" -Force
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UltraVNC-Windows-x64
          path: output/
